summary = "Program bytes flow via RawByteHandoff: consumer offers stdin/file first, producer claims after TSSP sniff"
content = "TOSH-0012 (2026-09-26). External programs' bytes pass unchanged between adjacent command stages, from a last-stage program to a single out>/out>> file, and from an in< file to a first-stage program. Mechanism: the engine (EvaluatePipelineAsync) creates a RawByteHandoff between each pair of adjacent CommandSyntax stages, plus initialRawInput (in<) and finalRawOutput (single direct out> file, only when fusion is null). ExecuteCommandSyntaxAsync binds each side to the per-stage CommandContext (not the command object: registered commands are shared; `with` copies are different objects and so can't claim). Consumer: ExternalProcessCommand.PumpStandardInputAsync offers process stdin BEFORE pulling input, withdraws in finally. Producer: after the TSSP header sniff, a plain-output program calls context.TryClaimRawOutput and copies via RawByteDestination.CopyFromAsync, yielding nothing; on reader exit (returns false) it disposes its stdout so the child meets a closed pipe. TSSP producers still yield records; TōSh stages still get ShellTextLine. Known limits: a TōSh function wrapping a program is not a byte path; multiple out> targets and buffered plans (o+e>, same file twice) stay text."

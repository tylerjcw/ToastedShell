summary = "CommandContext.IsPipelined is true for every stage incl. the first; HasUpstream says whether a stage has input"
content = "IsPipelined = pipeline has >1 stage or initial input, so it is true for the first stage of `a | b` too. CommandContext.HasUpstream (added for TOSH-0012) is true only when the stage's input comes from an earlier stage, an in< file or values handed to the pipeline. ExternalProcessCommand.DetermineSpawnMode uses it: only a captured stage with no upstream runs Hybrid (stdin/stderr inherited); `var x = (printf … | tr …)` at a TTY used to make tr read the keyboard."

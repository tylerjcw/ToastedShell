summary = "Function calls are dynamically scoped: a callee reads AND writes its caller's locals (spec says lexical)"
content = "The engine keeps one Stack<LexicalScope> (_scopes, ToshEngine.cs:23) and variable lookup walks it, so a function sees the locals of whoever called it, and `$x = ...` in a callee overwrites the caller's `var x`. Verified 2026-09-25. Generators leak the same way: a consumer block sees a suspended generator's locals. The spec (toastscript-spec.tex, Scoping) says lexical scoping. Slot-indexed variables need this settled first."

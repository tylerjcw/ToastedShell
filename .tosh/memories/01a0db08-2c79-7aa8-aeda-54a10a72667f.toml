summary = "Known test noise: parser-guard, race and http tests flake under parallel load; Journalctl/Lsipc fail without systemd"
content = "Full suite on 2026-09-25/26 (.NET 11 RC1, cloud container): ~7975 tests; failures not caused by code changes fall in two groups. Environmental: the Journalctl and Lsipc tests, which need systemd and IPC facilities the container lacks. Timing: ParserProgressGuardTests.Bounded_constructs_terminate_on_pathological_inputs (a 500 ms parse budget; up to four of its cases), Race_is_truly_concurrent, and UtilityCommandTests.Http_request_and_send_support_request_objects_and_out_files (local HTTP server) fail under a parallel full-suite load and pass when run alone. Re-run a failing one in isolation (dotnet test --no-build --filter ...) before treating it as a regression."

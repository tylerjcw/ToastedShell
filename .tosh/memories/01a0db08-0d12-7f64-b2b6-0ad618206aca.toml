summary = "Fixed: ext out> file, in< and background (&) pipelines now pass bytes unchanged; background out> no longer writes a BOM"
content = "TOSH-0012 (2026-09-26). The findings that `ext out> file` corrupted binary output and that `cat x | gzip -c out> f.gz` wrote a broken archive are fixed: a single out> target receives a program's bytes directly. Background pipelines (ShellJob.MonitorPipelineAsync) got the same: byte copy to a single out> file, in< passed as ToastBackgroundPipelineRequest.InputPath and copied as bytes, no UTF-8 BOM (Encoding.UTF8 wrote EF BB BF into every background out> file), and PumpPipeAsync closes the producer's stdout when the reader leaves (yes | head -1 & used to run forever)."

summary = "[fixed by TOSH-0012] `ext out> file` corrupted binary output; `cat x | gzip -c out> f.gz` wrote a broken archive"
content = "Verified 2026-09-25: redirecting an external command's stdout to a file goes through the same line-decoding path as external pipes. `/usr/bin/cat bin.dat out> out.bin` turned 100,000 random bytes into 181,127 (invalid UTF-8 replaced by U+FFFD), and `/usr/bin/cat bin.dat | /usr/bin/gzip -c out> out.gz` wrote an archive that gunzips to nothing. Downloads (`curl -s … out> file.png`), archives and compression are unsafe in the PoC. `writeline` streams raw text correctly; `echo` output is buffered and boxed. Note `>` is not a redirection operator in the PoC (it is `out>`): `cat f > g` passes '>' and 'g' to cat as arguments. The Rust design (Proposal 001 §7) makes `>`, `>>`, `2>` language-level redirections."
links = [{ path = "src/Tosh.Stdlib/ExternalProcessCommand.cs" }]


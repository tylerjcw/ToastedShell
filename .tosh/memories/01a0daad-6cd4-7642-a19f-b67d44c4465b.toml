summary = "Cloud sessions: .claude/hooks/session-start.sh installs .NET, registers it for app hosts, builds the companion"
content = "Claude Code on the web images have no .NET SDK. .claude/hooks/session-start.sh (SessionStart, startup|resume, cloud only) installs the SDK major from scripts/dotnet-major.sh into ~/.dotnet when it is missing, symlinks /usr/local/bin/dotnet, writes /etc/dotnet/install_location (app hosts never look in ~/.dotnet; without it Tosh.Cli's post-build step exits 131), exports DOTNET_ROOT and PATH through CLAUDE_ENV_FILE, builds the dev companion and restores Tosh.slnx. Cold run about 30 s, warm about 1.3 s. What a hook installs is not cached between sessions; the same SDK install in the cloud environment's setup script is cached, speeds startup, and lets the companion's MCP server start before the hook has finished."
links = [{ path = ".claude/hooks/session-start.sh" }, { path = ".claude/settings.json" }]


summary = "This .NET repo is a proof of concept; final Tōast is a separate Rust rewrite (own runtime). Improve the PoC, don't rewrite it"
content = "User decision (2026-09-25): the .NET TōSh/Tōast in this repository is a proof of concept for the final version. The final Tōast will be a separate greenfield rewrite in Rust: the core project holds the language only, it does not target .NET but has its own full runtime, it takes inspiration from Rust with a three-tier ownership model plus an optional gc mode where ownership need not be used. A rewrite of this .NET codebase is therefore not worth doing; improve this version instead. Work here should make the PoC safe and pleasant for daily use and produce evidence and assets (semantics experiments, conformance cases, diagnostics, command inventory) that inform the Rust design, rather than re-architect the .NET engine (the Phase B bound-tree evaluator, slot frames, a VM) that the Rust VM will replace."


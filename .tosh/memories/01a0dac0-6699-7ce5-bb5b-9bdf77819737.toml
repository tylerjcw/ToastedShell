summary = "Output is buffered: REPL per statement, -c and scripts for the whole run; nothing prints until done"
content = "EvaluateScriptStatementAsync collects each top-level statement's values with ToListAsync (ToshEngine.Statements.cs:223) before yielding, which defeats AutoDisplaySink's 250 ms streaming promotion in the REPL. -c and script files render through BufferingDisplaySink (Tosh.Cli/Program.cs:377, 388), so a script's output from all statements is merged into one table printed at exit. `for i in 1..3 { sleep 1; echo $i }` shows nothing for 3.5 s. External commands at a TTY stream because they inherit the terminal."
links = [{ path = "src/Tosh.Language/ToshEngine.Statements.cs" }, { path = "src/Tosh.Cli/AutoDisplaySink.cs" }, { path = "src/Tosh.Cli/Program.cs" }]

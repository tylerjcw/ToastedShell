summary = "parallel/race/async run blocks on cloned scopes: writes to outer variables are silently discarded"
content = "EngineBlockExecutor.Fork clones every visible LexicalScope (ToshEngine.cs Fork -> LexicalScope.Clone), so `var total = 0; 1..200 | parallel { $total = $total + 1 }` leaves total at 0 with no diagnostic. Objects referenced by variables are still shared and unsynchronized. Early termination also over-runs by one: `1..5 | each { ... } | first 1` runs the each body twice."
